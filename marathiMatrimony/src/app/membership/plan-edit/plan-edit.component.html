<!-- Top Nav stays above everything -->
<app-top-nav (toggleSidenav)="sidenav.toggle()"></app-top-nav>

<!-- Sidenav overlays main content -->
<mat-sidenav-container
  class="dashboard-container"
  [class.sidenav-open]="isSidenavOpen" style="margin-top: 4%;">
  <mat-sidenav
    #sidenav
    mode="over"
    [opened]="false"
    (openedChange)="onSidenavToggle($event)"
    class="custom-sidenav">
    <app-sidebar></app-sidebar>
  </mat-sidenav>

  <mat-sidenav-content class="main-content">
   <form [formGroup]="planForm" (ngSubmit)="onSubmit()" class="plan-form">
      <mat-form-field appearance="outline">
        <mat-label>Plan Name</mat-label>
        <input matInput formControlName="name" />
      </mat-form-field>
      <!-- Plan Title -->
      <mat-form-field appearance="outline">
        <mat-label>Plan Title</mat-label>
        <input matInput formControlName="title" placeholder="Premium Gold Plan" />
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Duration</mat-label>
        <mat-select formControlName="duration">
          <mat-option value="1">1 Month</mat-option>
          <mat-option value="3">3 Months</mat-option>
          <mat-option value="6">6 Months</mat-option>
          <mat-option value="12">12 Months</mat-option>
        </mat-select>
      </mat-form-field>

          <!-- Contact Limit -->
          <mat-form-field appearance="outline">
            <mat-label>Contact Limit</mat-label>
            <input matInput type="number" formControlName="contactLimit" placeholder="e.g. 50" />
          </mat-form-field>

          <!-- Priority for Sorting -->
          <mat-form-field appearance="outline">
            <mat-label>Priority</mat-label>
            <input matInput type="number" formControlName="priority" placeholder="1, 2, 3..." />
          </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Status</mat-label>
        <mat-select formControlName="planstatus">
          <mat-option value="Active">Active</mat-option>

          <ng-container *ngIf="planForm.get('users')?.value > 0; else activeInactive">
            <span matTooltip="Cannot set to Inactive while users are active">
              <mat-option value="Inactive" disabled>Inactive</mat-option>
            </span>
          </ng-container>

          <ng-template #activeInactive>
            <mat-option value="Inactive">Inactive</mat-option>
          </ng-template>
        </mat-select>
      </mat-form-field>



      <mat-form-field appearance="outline">
        <mat-label>Price (INR)</mat-label>
        <input matInput type="number" formControlName="price" />
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Users</mat-label>
        <input matInput type="number" formControlName="users" />
      </mat-form-field>
      
      <div class="features-section">
        <label>Included Features:</label>
        <mat-checkbox *ngFor="let feature of featuresList"
                      [checked]="planForm.value.features.includes(feature.value)"
                      (change)="toggleFeature(feature.value, $event.checked)">
          {{ feature.label }}
        </mat-checkbox>
      </div>

      <button mat-raised-button color="primary" type="submit" [disabled]="planForm.invalid">
        Update Plan
      </button>
    </form>

  </mat-sidenav-content>
</mat-sidenav-container>
