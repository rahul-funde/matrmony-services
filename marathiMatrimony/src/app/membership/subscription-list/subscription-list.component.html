<!-- Top Nav stays above everything -->
<app-top-nav (toggleSidenav)="sidenav.toggle()"></app-top-nav>

<!-- Sidenav overlays main content -->
<mat-sidenav-container
  class="dashboard-container"
  [class.sidenav-open]="isSidenavOpen">
  <mat-sidenav
    #sidenav
    mode="over"
    [opened]="false"
    (openedChange)="onSidenavToggle($event)"
    class="custom-sidenav">
    <app-sidebar></app-sidebar>
  </mat-sidenav>

  <mat-sidenav-content class="main-content">
    <div class="subscription-list-container">
      <mat-form-field appearance="outline" class="search-box">
        <mat-label>Search by User</mat-label>
        <input matInput [(ngModel)]="searchTerm" placeholder="Enter user name" />
      </mat-form-field>

      <table mat-table [dataSource]="filteredSubscriptions" class="mat-elevation-z2">

        <!-- User -->
        <ng-container matColumnDef="user">
          <th mat-header-cell *matHeaderCellDef> User </th>
          <td mat-cell *matCellDef="let sub"> {{ sub.user }} </td>
        </ng-container>

        <!-- Plan -->
        <ng-container matColumnDef="plan">
          <th mat-header-cell *matHeaderCellDef> Plan </th>
          <td mat-cell *matCellDef="let sub"> {{ sub.plan }} </td>
        </ng-container>

        <!-- Start Date -->
        <ng-container matColumnDef="start">
          <th mat-header-cell *matHeaderCellDef> Start Date </th>
          <td mat-cell *matCellDef="let sub"> {{ sub.start }} </td>
        </ng-container>

        <!-- End Date -->
        <ng-container matColumnDef="end">
          <th mat-header-cell *matHeaderCellDef> End Date </th>
          <td mat-cell *matCellDef="let sub"> {{ sub.end }} </td>
        </ng-container>

        <!-- Status -->
        <ng-container matColumnDef="status">
          <th mat-header-cell *matHeaderCellDef> Status </th>
          <td mat-cell *matCellDef="let sub"> {{ sub.status }} </td>
        </ng-container>

        <!-- Actions -->
        <ng-container matColumnDef="actions">
          <th mat-header-cell *matHeaderCellDef> Actions </th>
          <td mat-cell *matCellDef="let sub">
            <button mat-icon-button color="primary" (click)="renew(sub)">
              <mat-icon>autorenew</mat-icon>
            </button>
            <button mat-icon-button color="warn" (click)="cancel(sub)">
              <mat-icon>cancel</mat-icon>
            </button>
          </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="['user', 'plan', 'start', 'end', 'status', 'actions']"></tr>
        <tr mat-row *matRowDef="let row; columns: ['user', 'plan', 'start', 'end', 'status', 'actions']"></tr>
      </table>
    </div>


  </mat-sidenav-content>
</mat-sidenav-container>
