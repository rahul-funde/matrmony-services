<div class="container my-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
      <h4>Saved Matches</h4>
      <button class="btn btn-danger btn-sm" (click)="clearAll()" [disabled]="savedProfiles.length === 0">
        Clear All
      </button>
    </div>
  
    <div class="row">
      <div class="col-md-4 mb-3" *ngFor="let profile of savedProfiles">
        <div class="card h-100">
          <img [src]="profile.photoUrl" class="card-img-top" alt="Profile">
          <div class="card-body text-center">
            <h5 class="card-title">{{ profile.name }}, {{ profile.age }}</h5>
            <p class="card-text text-muted">{{ profile.location }}</p>
          </div>
        </div>
      </div>
    </div>
  
    <div *ngIf="savedProfiles.length === 0" class="alert alert-info text-center">
      No saved matches.
    </div>
  </div>
