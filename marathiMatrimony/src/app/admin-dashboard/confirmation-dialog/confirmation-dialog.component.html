    <h2 mat-dialog-title>Confirm Change</h2>
    <mat-dialog-content>
      <p>Are you sure you want to change?</p>
    </mat-dialog-content>
    <mat-dialog-actions>
      <button mat-button (click)="closeDialog(true)">Yes</button>
      <button mat-button (click)="closeDialog(false)">No</button>
    </mat-dialog-actions>
