<div class="chart-card">
  <div class="chart-header">
    <h3>User Growth</h3>

    <div class="chart-actions">
      <button
        [class.active]="view === 'week'"
        (click)="setView('week')">
        Week
      </button>

      <button
        [class.active]="view === 'month'"
        (click)="setView('month')">
        Month
      </button>

      <button
        [class.active]="view === 'year'"
        (click)="setView('year')">
        Year
      </button>
    </div>
  </div>

  <div class="chart-body">
    <canvas #userGrowthCanvas></canvas>
  </div>
</div>
