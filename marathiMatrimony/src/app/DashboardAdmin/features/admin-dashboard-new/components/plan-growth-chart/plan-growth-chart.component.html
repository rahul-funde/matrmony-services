<div class="chart-card">
  <div class="chart-header">
    <h3>Plan-wise Growth</h3>

    <div class="chart-actions">
      <button
        [class.active]="view === 'week'"
        (click)="setView('week')"
        [disabled]="loading">
        Week
      </button>

      <button
        [class.active]="view === 'month'"
        (click)="setView('month')"
        [disabled]="loading">
        Month
      </button>

      <button
        [class.active]="view === 'year'"
        (click)="setView('year')"
        [disabled]="loading">
        Year
      </button>
    </div>
  </div>

  <div class="chart-body">
    <canvas #planGrowthCanvas></canvas>
    <div *ngIf="loading" class="loading-placeholder">Loading chart...</div>
  </div>
</div>
