<div class="app-global-controls app-surface-card" role="group" aria-label="Application preferences">
  <div class="app-language-switcher">
    <label for="appLanguage">{{ 'app.language' | translate }}</label>
    <select
      id="appLanguage"
      [ngModel]="languageService.currentLanguage"
      (ngModelChange)="changeLanguage($event)"
    >
      <option
        *ngFor="let language of languageService.languages"
        [value]="language.code"
      >
        {{ language.nativeLabel }}
      </option>
    </select>
  </div>

  <app-primary-button
    class="app-theme-toggle"
    [label]="themeService.currentTheme === 'dark' ? ('APP.THEME_LIGHT' | translate) : ('APP.THEME_DARK' | translate)"
    type="button"
    variant="ghost"
    [ariaPressed]="themeService.currentTheme === 'dark'"
    [ariaLabel]="themeService.currentTheme === 'dark' ? 'Switch to light theme' : 'Switch to dark theme'"
    (click)="toggleTheme()"
  ></app-primary-button>
</div>

<router-outlet></router-outlet>
