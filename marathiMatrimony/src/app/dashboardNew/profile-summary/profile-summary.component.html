<div class="card shadow-sm border-0 glass-card mb-3">
  <div class="profile-wrapper" *ngIf="user$ | async as user">

    <!-- 🖼 Profile Image -->
    <div class="avatar-wrapper text-center">
      <img
        [src]="apiUrl + '/' + getProfileThumb(user)"
        (error)="onImageError($event)"
        alt="user"
        class="avatar"
      />
    </div>

    <!-- 🧾 User Details -->
    <div class="details">
      <h3 class="name-with-edit">
        {{ user.personalDetails.firstName }} {{ user.personalDetails.lastName }}
        <button class="edit-name-btn" (click)="goToProfile()">
          <mat-icon fontIcon="edit" class="edit-icon"></mat-icon>
        </button>
      </h3>

      <p class="text-muted mb-1">
        {{ user.personalDetails.dateOfBirth | ageCal }} yrs | {{ user.familyDetails.nativeDistrict }}
      </p>
      <p class="fw-semibold mb-2">{{ user.careerDetails.occupation }}</p>

      <!-- 📊 Progress Bar -->
      <mat-progress-bar
        mode="determinate"
        [value]="user?.profileCompletion ?? 10">
      </mat-progress-bar>

      <!-- Action Button -->
      <div class="mt-3">
        <button class="btn btn-upgrade" (click)="goToUpgrade()">
          <mat-icon fontIcon="star" class="btn-icon"></mat-icon>
          Upgrade Membership
        </button>
      </div>
    </div>
  </div>
</div>
